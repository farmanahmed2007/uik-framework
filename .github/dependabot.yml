version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Keep updates reviewable: patch and minor bumps are grouped into one PR,
    # majors arrive individually because this dependency tree is webpack-4 era
    # and a major is rarely a drop-in.
    groups:
      dev-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # sass-loader 17 requires Node >= 22.11.0, which would silently drop the
      # Node 20 support that README and the CI matrix both promise. Revisit
      # when Node 20 is no longer supported.
      - dependency-name: sass-loader
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
