version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Keep updates reviewable: patch and minor bumps are grouped into one PR,
    # majors arrive individually because this dependency tree is webpack-4 era
    # and a major is rarely a drop-in.
    groups:
      dev-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Pinned deliberately — see DEPENDENCY-AUDIT.md.
      # webpack 5 requires reworking the loader chain and the Uglify minimizer.
      - dependency-name: webpack
        update-types: ["version-update:semver-major"]
      - dependency-name: webpack-cli
        update-types: ["version-update:semver-major"]
      # svgo 2+ changes its plugin config format and breaks svgo-loader@2.
      - dependency-name: svgo
        update-types: ["version-update:semver-major"]
      - dependency-name: svgo-loader
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
