version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Keep updates reviewable: patch and minor bumps are grouped into one PR,
    # majors arrive individually because this dependency tree is webpack-4 era
    # and a major is rarely a drop-in.
    groups:
      dev-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
    # No major-version suppressions: the toolchain is now current (webpack 5,
    # ESLint 10, Stylelint 17), so majors are worth reviewing on their merits
    # rather than being blocked wholesale.

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
