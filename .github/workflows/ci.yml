name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Supersede in-flight runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor declared in package.json engines; 22 is what this
        # pipeline was developed against; 24 is what the maintainer develops on.
        # All three are proven here rather than assumed.
        node: ['20', '22', '24']

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # ubuntu-latest ships Chrome at /usr/bin/google-chrome, which
      # test/chrome-bin.js finds on its own. This makes the dependency explicit
      # so a runner image change fails here with a clear message rather than
      # inside Karma.
      - name: Verify a Chrome binary is available
        run: node -e "console.log('Using Chrome at', require('./test/chrome-bin'))"

      - name: Install dependencies
        run: npm ci

      - name: Lint JavaScript
        run: npm run lint:js

      - name: Lint SCSS
        run: npm run lint:scss

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Confirm the build produced both bundles
        run: |
          test -s src/dist/css/uik.bundle.min.css
          test -s src/dist/js/uik.bundle.min.js
          echo "CSS $(wc -c < src/dist/css/uik.bundle.min.css) bytes"
          echo "JS  $(wc -c < src/dist/js/uik.bundle.min.js) bytes"
